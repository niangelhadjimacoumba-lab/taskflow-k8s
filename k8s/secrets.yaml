# ATTENTION : ceci est un exemple pour environnement local (Minikube/Kind).
# Ne jamais committer de vrais secrets en clair. En production, utiliser
# un gestionnaire externe (Sealed Secrets, Vault, SOPS, AWS Secrets Manager...).
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
type: Opaque
stringData:
  JWT_SECRET_KEY: "change-me-in-production"
