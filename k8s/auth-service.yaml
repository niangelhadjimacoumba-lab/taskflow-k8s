apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: taskflow
  labels:
    app: auth-service
spec:
  # SQLite + emptyDir : 1 replica. Passer a PostgreSQL avant de scaler.
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/niangelhadjimacoumba-lab/taskflow-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: JWT_SECRET_KEY
            - name: DATABASE_URL
              value: "sqlite:////data/auth.db"
          volumeMounts:
            - name: auth-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: auth-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taskflow
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
