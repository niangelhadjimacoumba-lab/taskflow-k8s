apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: taskflow
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s

    scrape_configs:
      - job_name: "auth-service"
        static_configs:
          - targets: ["auth-service:8000"]
        metrics_path: /metrics

      - job_name: "tasks-service"
        static_configs:
          - targets: ["tasks-service:8000"]
        metrics_path: /metrics

      - job_name: "notifications-service"
        static_configs:
          - targets: ["notifications-service:8000"]
        metrics_path: /metrics
