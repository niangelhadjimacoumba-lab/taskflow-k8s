apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: taskflow
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: taskflow
        folder: TaskFlow
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-taskflow
  namespace: taskflow
data:
  taskflow-overview.json: |
    {
      "title": "TaskFlow - Vue d'ensemble",
      "timezone": "browser",
      "panels": [
        {
          "title": "Requetes par seconde (par service)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_requests_total[1m])) by (job)" }
          ]
        },
        {
          "title": "Latence p95 (par service)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))" }
          ]
        },
        {
          "title": "Taux d'erreurs 5xx",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "sum(rate(http_requests_total{status=~\"5..\"}[5m])) by (job)" }
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
